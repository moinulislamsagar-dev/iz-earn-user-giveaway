<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Create Giveaway</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #e2e8f0);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 100px;
    }
    h1 { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 14px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; opacity: 0.9; }
    .type-row { display: flex; gap: 8px; }
    .type-btn {
      flex: 1; padding: 11px 6px; border-radius: 11px;
      border: 2px solid rgba(255,255,255,0.12); background: transparent;
      color: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer;
    }
    .type-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    input {
      width: 100%; padding: 11px 12px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.22);
      color: inherit; font-size: 1rem; outline: none;
    }
    input:focus { border-color: #38bdf8; }
    input.invalid { border-color: #f87171; }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .err { display: none; color: #f87171; font-size: 0.78rem; margin-top: 4px; font-weight: 600; }
    .err.show { display: block; }
    .pool { text-align: center; margin: 10px 0 14px; font-size: 0.95rem; }
    .pool b { color: #4ade80; }
    #createBtn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: #22c55e; color: #052e16; font-size: 1.02rem; font-weight: 800; cursor: pointer;
    }
    #createBtn:disabled { opacity: 0.55; }
  </style>
</head>
<body>
  <h1>🎁 Create Giveaway</h1>
  <div class="card">
    <div class="field">
      <label>Type</label>
      <div class="type-row">
        <button type="button" class="type-btn active" id="btnMain">⚡ Main</button>
        <button type="button" class="type-btn" id="btnXr">🚀 xRocket</button>
      </div>
    </div>
    <div class="field">
      <label>Winners</label>
      <input id="winners" type="number" inputmode="numeric" min="1" step="1" placeholder="10" />
      <div class="err" id="err_winners"></div>
    </div>
    <div class="field">
      <label>Per Winner ($)</label>
      <input id="perWinner" type="number" inputmode="decimal" min="0" step="0.001" placeholder="0.01" />
      <div class="err" id="err_perWinner"></div>
    </div>
    <div class="field">
      <label>Hours</label>
      <input id="hours" type="number" inputmode="decimal" min="0.25" max="48" step="0.25" placeholder="6" />
      <div class="err" id="err_hours"></div>
    </div>
    <div class="field">
      <label>Channel</label>
      <input id="channel" type="text" placeholder="@channel" autocomplete="off" />
      <div class="err" id="err_channel"></div>
    </div>
  </div>
  <div class="pool">Prize pool: <b id="poolText">0$</b></div>
  <button type="button" id="createBtn">✅ Create Giveaway</button>
  <script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); } catch (e) {} try { tg.expand(); } catch (e) {} }

  var type = "main";
  var btnMain = document.getElementById("btnMain");
  var btnXr = document.getElementById("btnXr");
  var createBtn = document.getElementById("createBtn");
  var ids = ["winners", "perWinner", "hours", "channel"];

  function setType(t) {
    type = t;
    btnMain.classList.toggle("active", t === "main");
    btnXr.classList.toggle("active", t === "xrocket");
    clearErr("perWinner");
    updatePool();
  }
  btnMain.onclick = function () { setType("main"); };
  btnXr.onclick = function () { setType("xrocket"); };

  function val(id) { return String(document.getElementById(id).value || "").trim(); }
  function num(id) {
    var v = parseFloat(val(id).replace(",", "."));
    return isNaN(v) ? NaN : v;
  }
  function clearErr(id) {
    document.getElementById(id).classList.remove("invalid");
    var e = document.getElementById("err_" + id);
    e.textContent = "";
    e.classList.remove("show");
  }
  function setErr(id, msg) {
    document.getElementById(id).classList.add("invalid");
    var e = document.getElementById("err_" + id);
    e.textContent = msg;
    e.classList.add("show");
  }
  function clearAll() { ids.forEach(clearErr); }

  function normChannel(raw) {
    var s = String(raw || "").trim().replace(/\s+/g, "");
    if (!s) return "";
    if (s.indexOf("https://t.me/") === 0) s = s.replace("https://t.me/", "");
    else if (s.indexOf("http://t.me/") === 0) s = s.replace("http://t.me/", "");
    else if (s.indexOf("t.me/") === 0) s = s.replace("t.me/", "");
    s = s.split("/")[0].split("?")[0].replace(/^@/, "");
    if (!s || s.length < 4) return "";
    return "@" + s;
  }

  function updatePool() {
    var w = num("winners");
    var p = num("perWinner");
    var pool = (!isNaN(w) && !isNaN(p) && w > 0 && p > 0) ? (w * p) : 0;
    document.getElementById("poolText").textContent = pool > 0 ? (pool.toFixed(4).replace(/\.?0+$/, "") + "$") : "0$";
  }

  function validate() {
    clearAll();
    var ok = true;
    var winners = num("winners");
    var per = num("perWinner");
    var hours = num("hours");
    var channel = normChannel(val("channel"));
    var minPer = type === "xrocket" ? 0.01 : 0.005;

    if (!winners || winners < 1 || Math.floor(winners) !== winners) {
      setErr("winners", "Invalid");
      ok = false;
    }
    if (!per || per < minPer) {
      setErr("perWinner", type === "xrocket" ? "Min 0.01$" : "Min 0.005$");
      ok = false;
    }
    if (ok && winners && per && winners * per < 0.05) {
      setErr("perWinner", "Pool min 0.05$");
      ok = false;
    }
    if (!hours || hours < 0.25) {
      setErr("hours", "Min 0.25h");
      ok = false;
    } else if (hours > 48) {
      setErr("hours", "Max 48h");
      ok = false;
    }
    if (!channel) {
      setErr("channel", "Invalid");
      ok = false;
    }
    if (!ok) {
      var el = document.querySelector("input.invalid");
      if (el) try { el.focus(); } catch (e) {}
      return null;
    }
    return {
      type: type,
      winners: Math.floor(winners),
      per: Math.round(per * 10000) / 10000,
      hours: Math.round(hours * 1000) / 1000,
      channel: channel,
      pool: Math.round(winners * per * 10000) / 10000
    };
  }

  createBtn.onclick = function () {
    var d = validate();
    if (!d) return;
    if (!tg || typeof tg.sendData !== "function") {
      setErr("channel", "Open from bot");
      return;
    }
    // ugw_create|type|winners|per|hours|channel|pool
    var payload = ["ugw_create", d.type, d.winners, d.per, d.hours, d.channel, d.pool].join("|");
    createBtn.disabled = true;
    try { tg.sendData(payload); }
    catch (e) {
      createBtn.disabled = false;
      setErr("channel", "Send failed");
    }
  };

  ids.forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      clearErr(id);
      updatePool();
    });
  });
  setType("main");
})();
  </script>
</body>
</html>
